name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: the only job that lints and tests.
  #
  # The shared sampling/formatting/config layer is platform-independent, so it
  # is checked on Linux, the cheapest runner. `cargo fmt` at a workspace root
  # covers every member, so all crates are style-checked here even though the
  # platform crates are not buildable on Linux; `cargo clippy` and `cargo test`
  # act on the workspace's default members (the cross-platform crates), which
  # is what they already did on every runner before this split.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify tag matches workspace version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify third-party notices are current
        run: python3 .github/scripts/check_third_party_notices.py
      - name: Format check (all workspace members)
        run: cargo fmt --check
      - name: Clippy (default members)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (default members)
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Build gate + distribution packaging.
  #
  # Both platform jobs run an architecture matrix: Windows x64/arm64 and
  # macOS arm64/x64. Each leg cross-compiles with an explicit Rust target, so
  # the runner's host architecture never decides the package architecture.
  # These jobs do not repeat the quality checks: the logic they depend on is
  # already covered by the quality job.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build & package (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      SV_BUILD_ID_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build Windows display layer
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-win
      - name: Build GPUI settings window
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-settings
      - name: Build GPUI history chart
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-history
      # Portable (green) distribution: one SysVitals/ directory containing the
      # overlay, settings and history executables, LICENSE and the generated
      # third-party notices. Tag builds use the exact tag version, e.g.
      # SysVitals_Windows_{arch}_v0.1.0.zip; main builds keep the dev name
      # with the workspace version, short commit hash and `_dev` suffix.
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $arch = "${{ matrix.arch }}"
          $target = "${{ matrix.target }}"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseVersion = $env:GITHUB_REF_NAME -replace "^v", ""
            $zip = "SysVitals_Windows_${arch}_v${releaseVersion}.zip"
          } else {
            $commit = (git rev-parse --short HEAD)
            $zip = "SysVitals_Windows_${arch}_v${version}_${commit}_dev.zip"
          }
          $stage = "SysVitals"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          $files = @(
            "target/$target/release/SysVitals.exe",
            "target/$target/release/SysVitalsSettings.exe",
            "target/$target/release/SysVitalsHistory.exe",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md"
          )
          foreach ($f in $files) {
            if (!(Test-Path $f)) { throw "missing build output: $f" }
            Copy-Item -Path $f -Destination $stage
          }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Write-Host "Packaged $zip"
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-windows-${{ matrix.arch }}
          path: SysVitals_Windows_${{ matrix.arch }}_*.zip
          if-no-files-found: error

  build-macos:
    name: Build & package (macOS ${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SV_BUILD_ID_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build macOS display layer
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-mac
      - name: Build GPUI settings window
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-settings
      - name: Build GPUI history chart
        run: cargo build --locked --release --target ${{ matrix.target }} -p app-history
      # One bundle, not three apps: the indicator is the declared
      # CFBundleExecutable, and the settings/history binaries are sibling
      # executables it launches from Contents/MacOS. Tag builds use the exact
      # tag version in the zip name; main builds keep the dev name. The bundle
      # also carries LICENSE and the generated third-party notices under
      # Contents/Resources.
      - name: Package macOS app bundle
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          arch="${{ matrix.arch }}"
          target="${{ matrix.target }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_version="${GITHUB_REF_NAME#v}"
            short_version="${release_version%%-*}"
          else
            commit=$(git rev-parse --short HEAD)
            release_version="$version"
            short_version="${version%%-*}"
          fi
          app="SysVitals.app"
          bin="target/$target/release"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          for f in sysvitals SysVitalsSettings SysVitalsHistory; do
            if [ ! -f "$bin/$f" ]; then
              echo "missing build output: $bin/$f" >&2
              exit 1
            fi
          done
          cp "$bin/sysvitals" "$app/Contents/MacOS/sysvitals"
          cp "$bin/SysVitalsSettings" "$app/Contents/MacOS/SysVitalsSettings"
          cp "$bin/SysVitalsHistory" "$app/Contents/MacOS/SysVitalsHistory"
          cp crates/app-mac/assets/Info.plist "$app/Contents/Info.plist"
          cp crates/app-mac/assets/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cp LICENSE "$app/Contents/Resources/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          # The plist is a template; substitute the numeric base version and a
          # numeric build number so Finder/Get Info never shows a stale 0.0.0.
          # Any version suffix stays in the zip/tag/settings footer, while
          # CFBundleShortVersionString stays a plain numeric version.
          # `github.run_number` is monotonic even on the default shallow clone;
          # `git rev-list --count HEAD` would always be 1 there.
          plutil -replace CFBundleShortVersionString -string "$short_version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$app/Contents/Info.plist"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            zip_name="SysVitals_macOS_${arch}_v${release_version}.zip"
          else
            zip_name="SysVitals_macOS_${arch}_v${release_version}_${commit}_dev.zip"
          fi
          zip -qr "$zip_name" "$app"
          echo "Packaged $zip_name"
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SysVitals-macos-${{ matrix.arch }}
          path: SysVitals_macOS_${{ matrix.arch }}_*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release gate: tag pushes only. The four build legs have already produced
  # the formal zips; this job validates their contents, writes the per-archive
  # .sha256 files, creates a draft Release, uploads and re-downloads the assets
  # to verify them, then publishes the Release.
  #
  # Versions containing a suffix are still marked --prerelease for
  # compatibility, but the current release flow publishes final versions only;
  # the 0.1.0 tag follows the path without --prerelease. A failed verification
  # leaves the Release as a draft so a re-run can complete it without exposing
  # partial assets.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [quality, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          pattern: SysVitals-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets

          expected=(
            "SysVitals_Windows_x64_v${VERSION}.zip"
            "SysVitals_Windows_arm64_v${VERSION}.zip"
            "SysVitals_macOS_arm64_v${VERSION}.zip"
            "SysVitals_macOS_x64_v${VERSION}.zip"
          )
          for f in "${expected[@]}"; do
            test -f "$f" || { echo "missing asset: $f" >&2; exit 1; }
          done
          if find . -maxdepth 1 -name '*_dev.zip' | grep -q .; then
            echo "development assets must not be published" >&2
            exit 1
          fi

          find . -maxdepth 1 -name 'SysVitals_*.zip' -printf '%f\n' | LC_ALL=C sort > /tmp/actual-zips
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > /tmp/expected-zips
          diff -u /tmp/expected-zips /tmp/actual-zips

          windows_zip="SysVitals_Windows_x64_v${VERSION}.zip"
          for entry in \
            "SysVitals/SysVitals.exe" \
            "SysVitals/SysVitalsSettings.exe" \
            "SysVitals/SysVitalsHistory.exe" \
            "SysVitals/LICENSE" \
            "SysVitals/THIRD_PARTY_NOTICES.md"; do
            unzip -Z1 "$windows_zip" | tr '\\' '/' | grep -Fxq "$entry" \
              || { echo "missing in $windows_zip: $entry" >&2; exit 1; }
          done

          macos_zip="SysVitals_macOS_arm64_v${VERSION}.zip"
          for entry in \
            "SysVitals.app/Contents/MacOS/sysvitals" \
            "SysVitals.app/Contents/MacOS/SysVitalsSettings" \
            "SysVitals.app/Contents/MacOS/SysVitalsHistory" \
            "SysVitals.app/Contents/Info.plist" \
            "SysVitals.app/Contents/Resources/AppIcon.icns" \
            "SysVitals.app/Contents/Resources/LICENSE" \
            "SysVitals.app/Contents/Resources/THIRD_PARTY_NOTICES.md"; do
            unzip -Z1 "$macos_zip" | tr '\\' '/' | grep -Fxq "$entry" \
              || { echo "missing in $macos_zip: $entry" >&2; exit 1; }
          done

          unzip -p "$macos_zip" "SysVitals.app/Contents/Info.plist" > /tmp/Info.plist
          python3 - "$VERSION" <<'PY'
          import plistlib
          import sys

          version = sys.argv[1]
          base = version.split("-", 1)[0]
          with open("/tmp/Info.plist", "rb") as fh:
              plist = plistlib.load(fh)
          assert plist["CFBundleShortVersionString"] == base, plist
          assert str(plist["CFBundleVersion"]).strip(), plist
          print(f"plist ok: {base} / {plist['CFBundleVersion']}")
          PY

          for zip in "${expected[@]}"; do
            sha256sum "$zip" > "$zip.sha256"
          done
          echo "checksums written for ${#expected[@]} archives"
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "release $TAG is already published" >&2
              exit 1
            fi
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq SHA256SUMS; then
              gh release delete-asset "$TAG" SHA256SUMS --yes
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=( "$TAG" --title "sysvitals v$VERSION" --draft --verify-tag --notes-from-tag )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" release-assets/*
          fi
      - name: Verify uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify
          cd verify
          if [ -e SHA256SUMS ]; then
            echo "SHA256SUMS must not be published" >&2
            exit 1
          fi
          for f in SysVitals_*.zip; do
            test -f "$f.sha256"
            sha256sum -c "$f.sha256"
          done
          echo "uploaded assets verified"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease
      - name: Show release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG"
