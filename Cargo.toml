[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/panel-support",
    "crates/app-win",
    "crates/app-mac",
    "crates/app-settings",
    "crates/app-history",
]

# Plain `cargo build|test|check` only touches cross-platform crates.
# Platform crates (app-win / app-mac / app-settings / app-history) are built
# explicitly with `-p`, so a Linux host never fails on `windows`/`objc2`/GPUI
# dependencies.
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0-rc.10"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fynhq/sysvitals"
publish = false

[workspace.dependencies]
# Single source of truth for versions; crates inherit with `workspace = true`.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "network"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
directories = "=6.0.0"
# `bundled` statically embeds SQLite so there is no system-library dependency
# on Windows/macOS. History storage (R12) is the only consumer.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Local crates
sysvitals-core = { path = "crates/core" }

# GPUI Kit: modern cross-platform UI framework for the settings window.
# Pinned to the exact version; GPUI is pre-1.0 and moves fast.
gpui-kit = "=0.7.3"

# Local-time formatting for history chart labels and clipboard rows. Only the
# `clock`+`std` subset is enabled (no parsing, locales, or serde).
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

# Profiles: GPUI-heavy stacks run poorly in a pure debug build, and the
# sampler must stay cheap. Keep dev optimized enough to be representative.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
