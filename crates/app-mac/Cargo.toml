[package]
name = "app-mac"
description = "macOS display layer: NSStatusItem menu-bar indicator (objc2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# macOS-only. Build explicitly with `cargo build -p app-mac` on macOS.
# Dependencies are target-gated so the workspace resolves on other platforms.

[dependencies]
sysvitals-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
chrono = { workspace = true }
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSAttributedString",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusItem",
    "NSStringDrawing",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "block2",
] }
objc2-foundation = { version = "=0.3.2", features = [
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSNotification",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSValue",
    "block2",
] }
block2 = "=0.6.2"

[[bin]]
name = "sysvitals"
path = "src/main.rs"
