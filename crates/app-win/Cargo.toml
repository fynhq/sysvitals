[package]
name = "app-win"
description = "Windows display layer: topmost taskbar overlay indicator (Win32 layered window + GDI text)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Windows-only. Build explicitly with `cargo build -p app-win` on a Windows
# MSVC host (or via CI). The `windows` dependency is target-gated so the
# workspace still resolves on Linux/macOS.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-support = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[build-dependencies]
# Host-agnostic: returns `NotWindows` and does nothing when the target is not
# Windows, so it stays a plain build-dependency on every host.
embed-resource = "=3.0.12"

[[bin]]
# Mixed-case on purpose: the shipped executable is `SysVitals.exe`.
name = "SysVitals"
path = "src/main.rs"
