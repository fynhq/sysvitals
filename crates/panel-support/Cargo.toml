[package]
name = "sysvitals-panel"
description = "Shared GPUI panel theme, accent and backdrop helpers for the SysVitals settings/history windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cross-platform helpers used by both GPUI panels. Built as part of their
# platform builds; kept out of default-members so headless hosts skip it.
# GPUI-free process plumbing (logging, panic hook, registry probes) lives in
# `sysvitals-support` and is re-exported here so panel call sites have one
# import surface.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-support = { workspace = true }
gpui-kit = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSColor",
    "NSColorSpace",
    "objc2-core-foundation",
] }
