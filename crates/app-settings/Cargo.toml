[package]
name = "app-settings"
description = "GPUI-based settings window for SysVitals, launched by the platform overlay."
version.workspace = true
edition = "2024"
rust-version = "1.85"
license.workspace = true
repository.workspace = true
publish.workspace = true

# Platform-specific: requires a desktop GPU context. Built explicitly with
# `cargo build -p app-settings` on Windows/macOS (or via CI). Kept out of
# default-members so headless hosts (Linux CI test job) skip it.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-panel = { path = "../panel-support" }
gpui-kit = { workspace = true }

# Windows-only: the settings window reads the same registry flag as the
# overlay (HKCU Explorer\Advanced\TaskbarAl) to decide whether to offer the
# taskbar anchor choices, and probes the OS build number (RtlGetVersion) to
# decide which backdrop material the platform layer supports.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# macOS-only: reads AppKit's dynamic `controlAccentColor` so the panel's
# primary buttons follow the current system accent in every mode, including
# the default multicolor / wallpaper-derived setting. GPUI does not expose
# NSColor; the pinned objc2 stack matches app-mac so the lockfile keeps one
# version of each crate (default features stay on, same as app-mac).
# `NSColor::getRed_green_blue_alpha` is gated behind app-kit's own
# `objc2-core-foundation` feature (it hands back `CGFloat` pointers), so that
# feature must be named or the method is missing at compile time. `CGFloat`
# is a plain `f64` alias on the supported 64-bit targets, so no type import is
# needed to pass the out-params.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSAppearance",
    "NSApplication",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[[bin]]
name = "SysVitalsSettings"
path = "src/main.rs"
