[package]
name = "app-history"
description = "GPUI-based history trend chart popup for SysVitals, launched by the platform overlay on click."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cross-platform GPUI window. Built explicitly with `cargo build -p app-history`.
# Kept out of default-members so headless hosts skip it.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-panel = { path = "../panel-support" }
gpui-kit = { workspace = true }
arboard = "=3.7.0"
chrono = { workspace = true }

# Windows-only: the popup reads the system accent color (DWM) so its primary
# button style matches the OS theme color, and probes the OS build number
# (RtlGetVersion) plus the transparency-effects preference to pick a backdrop.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# macOS-only: reads AppKit's dynamic `controlAccentColor` so the popup's
# primary tile and focus ring follow the current system accent in every mode,
# including the default multicolor / wallpaper-derived setting (same
# rationale as the settings panel). See app-settings for the
# feature-selection notes.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSColor",
    "NSColorSpace",
    "objc2-core-foundation",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[[bin]]
name = "SysVitalsHistory"
path = "src/main.rs"
