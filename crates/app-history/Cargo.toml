[package]
name = "app-history"
description = "GPUI-based history trend chart popup for SysVitals, launched by the platform overlay on click."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cross-platform GPUI window. Built explicitly with `cargo build -p app-history`.
# Kept out of default-members so headless hosts skip it.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-panel = { path = "../panel-support" }
gpui-kit = { workspace = true }
arboard = "=3.7.0"

# Platform-specific theme, DPI, and parent-watch dependencies are inherited
# through `sysvitals-panel`; this binary has no direct platform calls.

[build-dependencies]
sysvitals-build = { path = "../build-support" }

[[bin]]
name = "SysVitalsHistory"
path = "src/main.rs"
