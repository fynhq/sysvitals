[package]
name = "app-history"
description = "GPUI-based history trend chart popup for SysVitals, launched by the platform overlay on click."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cross-platform GPUI window. Built explicitly with `cargo build -p app-history`.
# Kept out of default-members so headless hosts skip it.

[dependencies]
sysvitals-core = { workspace = true }
sysvitals-panel = { path = "../panel-support" }
gpui-kit = { workspace = true }
arboard = "=3.7.0"

# Windows-only: the popup reads the system accent color (DWM) so its primary
# button style matches the OS theme color, probes the OS build number
# (RtlGetVersion) plus the transparency-effects preference to pick a backdrop,
# and moves its own hidden window onto the target display before activation.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# macOS-only dependencies for the GPUI popup are inherited through
# `sysvitals-panel`; this binary has no direct macOS platform calls.

[build-dependencies]
sysvitals-build = { path = "../build-support" }

[[bin]]
name = "SysVitalsHistory"
path = "src/main.rs"
