[package]
name = "app-history"
description = "GPUI history chart popup for SysVitals, linked into the SysVitalsPanel host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cross-platform GPUI window. Built explicitly with `cargo build -p app-history`.
